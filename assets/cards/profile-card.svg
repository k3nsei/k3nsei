            <g class="tick" transform="translate(0, 0)">
              <line class="mark" y2="6" stroke="currentColor" />
              <text class="label" y="9" fill="currentColor">25/11</text>
            </g>

            <g class="tick" transform="translate(60.16438356164384, 0)">
              <line class="mark" y2="6" stroke="currentColor" />
              <text class="label" y="9" fill="currentColor">26/01</text>
            </g>

            <g class="tick" transform="translate(118.35616438356163, 0)">
              <line class="mark" y2="6" stroke="currentColor" />
              <text class="label" y="9" fill="currentColor">26/03</text>
            </g>

            <g class="tick" transform="translate(178.5205479452055, 0)">
              <line class="mark" y2="6" stroke="currentColor" />
              <text class="label" y="9" fill="currentColor">26/05</text>
            </g>

            <g class="tick" transform="translate(238.68493150684932, 0)">
              <line class="mark" y2="6" stroke="currentColor" />
              <text class="label" y="9" fill="currentColor">26/07</text>
            </g>

            <g class="tick" transform="translate(299.83561643835617, 0)">
              <line class="mark" y2="6" stroke="currentColor" />
              <text class="label" y="9" fill="currentColor">26/09</text>
            </g>

            <g class="tick" transform="translate(360, 0)">
              <line class="mark" y2="6" stroke="currentColor" />
              <text class="label" y="9" fill="currentColor">26/11</text>
            </g>
          </g>

          <g
            class="y-axis"
            transform="translate(360, 0)"
            color="#9198A1"
            fill="none"
            font-size="10"
            text-anchor="start"
            dominant-baseline="middle"
          >
            <line
              class="line"
              x1="0"
              x2="0"
              y1="0"
              y2="112"
              stroke="currentColor"
            />

            <g class="tick" transform="translate(0,112)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">0</text>
            </g>

            <g class="tick" transform="translate(0,100.8)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">100</text>
            </g>

            <g class="tick" transform="translate(0,89.60000000000001)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">200</text>
            </g>

            <g class="tick" transform="translate(0,78.39999999999999)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">300</text>
            </g>

            <g class="tick" transform="translate(0,67.2)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">400</text>
            </g>

            <g class="tick" transform="translate(0,56)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">500</text>
            </g>

            <g class="tick" transform="translate(0,44.800000000000004)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">600</text>
            </g>

            <g class="tick" transform="translate(0,33.60000000000001)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">700</text>
            </g>

            <g class="tick" transform="translate(0,22.399999999999995)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">800</text>
            </g>

            <g class="tick" transform="translate(0,11.199999999999998)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">900</text>
            </g>

            <g class="tick" transform="translate(0,0)">
              <line class="mark" x2="6" stroke="currentColor" />
              <text class="label" x="9" fill="currentColor">1,000</text>
            </g>
          </g>
        </g>
      </symbol>
    </defs>
  </g>
</svg>
